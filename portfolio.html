<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio · Chanhee Park</title>
<meta name="description" content="Research and project portfolio of Chanhee Park: benchmark design, agent development and evaluation, domain transfer, inference optimization.">
<link rel="canonical" href="https://johnnynlp.github.io/portfolio.html">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffffff; --fg:#16191d; --muted:#5b6470; --rule:#e3e6ea;
  --accent:#12544F; --accent-soft:rgba(18,84,79,.09); --accent-line:rgba(18,84,79,.22);
  --chip:#f2f4f7; --card:#fafbfc;
  --kind:#9A5B2D; --kind-soft:rgba(154,91,45,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1115; --fg:#e8eaed; --muted:#9aa3ae; --rule:#252a31;
    --accent:#6BC7BF; --accent-soft:rgba(107,199,191,.13); --accent-line:rgba(107,199,191,.26);
    --chip:#1a1e24; --card:#14171c;
    --kind:#E3A96B; --kind-soft:rgba(227,169,107,.15);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1115; --fg:#e8eaed; --muted:#9aa3ae; --rule:#252a31;
  --accent:#6BC7BF; --accent-soft:rgba(107,199,191,.13); --accent-line:rgba(107,199,191,.26);
  --chip:#1a1e24; --card:#14171c;
  --kind:#E3A96B; --kind-soft:rgba(227,169,107,.15);
}
html{
  /* 이 값 하나로 페이지 전체 크기가 조절됩니다.
     제목·본문·목록이 모두 rem 단위라 함께 커지고 작아집니다. */
  font-size:20px;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:"Source Sans 3",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:1rem; line-height:1.62; -webkit-font-smoothing:antialiased;
}
.wrap{
  /* 화면 폭의 82%. 이 숫자 하나만 바꾸면 전체 폭이 조정됩니다.
     1180px 상한은 아주 큰 모니터에서 한 줄이 지나치게 길어지는 것만 막습니다. */
  width:min(82%, 1180px); margin:0 auto; padding:64px 0 96px;
}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}
h1{font-size:2.25rem; font-weight:700; letter-spacing:-.02em; margin:0 0 .15em; line-height:1.15}
h1 .kr{font-size:1.05rem; font-weight:400; color:var(--muted); margin-left:.5em; letter-spacing:0}
.role{font-size:1.05rem; color:var(--accent); font-weight:600; margin:0 0 .9em}
.links{font-size:.93rem; color:var(--muted); display:flex; flex-wrap:wrap; gap:.5em 1.1em; margin-bottom:2.2em}
.lead{font-size:1.12rem; line-height:1.6; border-left:3px solid var(--accent); padding-left:1.1em; margin:0 0 3em}
.lead strong{font-weight:600}
h2{
  color:var(--accent);
  font-size:.8rem; font-weight:700; letter-spacing:.11em; text-transform:uppercase;
  color:var(--fg); margin:3em 0 1.2em; padding-bottom:.5em; border-bottom:2px solid var(--accent);
}
h3{font-size:1.05rem; font-weight:600; margin:0 0 .25em}
.item{margin-bottom:2em}
.meta{font-size:.88rem; color:var(--muted); margin:0 0 .55em}
.item p{margin:0 0 .6em}
.card{background:var(--card); border:1px solid var(--rule); border-radius:8px; padding:1.2em 1.4em; margin-bottom:1.4em}
.card h3{margin-bottom:.35em}
.num{font-weight:600; color:var(--fg)}
ul{margin:.4em 0 0; padding-left:1.15em}
li{margin-bottom:.3em}
.pub{margin-bottom:1.8em; font-size:1rem; display:flex; gap:1.4em; align-items:flex-start}
.pub .fig{
  /* 고정 비율 없음 — 가로는 꽉 채우고 세로는 그림 비율대로.
     아주 세로로 긴 그림만 max-height 로 제한합니다. */
  width:340px; flex:0 0 340px; border:1px solid var(--rule); border-radius:6px;
  background:var(--card); margin-top:.2em; padding:6px; overflow:hidden;
  display:flex; align-items:center; justify-content:center;
}
.pub .fig img{max-width:100%; max-height:300px; width:auto; height:auto; display:block}
.pub .txt{flex:1; min-width:0}
@media (max-width:560px){
  .pub{gap:.85em}
  .pub .fig{width:150px; flex:0 0 150px}
}
.pub .t{font-weight:600; line-height:1.42; padding:.1em 0 .3em}
.pub .t a{color:var(--fg)}
.pub .t a:hover{color:var(--accent)}
.pub .a{color:var(--muted); font-size:.95rem; padding-bottom:.15em}
.pub .v{font-style:italic}
.pub .tag{
  display:inline-block; font-size:.75rem; font-style:normal; padding:.1em .55em;
  background:var(--chip); border-radius:4px; color:var(--muted); margin-left:.4em; vertical-align:1px;
}
.pub .kind, .pub .first{
  display:inline-block; font-size:.72rem; font-style:normal; padding:.1em .5em;
  border-radius:4px; margin-left:.4em; vertical-align:1px; white-space:nowrap;
}
.pub .kind{background:var(--kind-soft); color:var(--kind); font-weight:600;
  text-transform:uppercase; letter-spacing:.04em; font-size:.68rem}
.pub .honor{background:var(--accent); color:var(--bg); font-weight:700;
  text-transform:uppercase; letter-spacing:.04em; font-size:.68rem;
  display:inline-block; padding:.1em .5em; border-radius:4px; margin-left:.4em;
  vertical-align:1px; font-style:normal; white-space:nowrap}
.pub .first{background:var(--accent-soft); color:var(--accent); font-weight:600;
  text-transform:uppercase; letter-spacing:.04em; font-size:.68rem}
.me{font-weight:700; color:var(--fg)}
.grid{display:grid; grid-template-columns:auto 1fr; gap:.45em 1.4em; font-size:.97rem}
.grid dt{font-weight:600; color:var(--muted)}
.grid dd{margin:0}
.row{display:flex; justify-content:space-between; align-items:baseline; gap:1em; flex-wrap:wrap}
.row .when{font-size:.88rem; color:var(--muted); white-space:nowrap}
footer{margin-top:4em; padding-top:1.5em; border-top:2px solid var(--accent); font-size:.88rem; color:var(--muted)}
.strip{height:10px; background:var(--accent); width:100%}
.strip.bottom{margin-top:2.2em}
@media (max-width:720px){
  .wrap{width:auto; padding:40px 18px 64px}
  nav.jump{margin-left:-18px; margin-right:-18px; padding-left:18px; padding-right:18px}
}
@media (max-width:560px){
  h1{font-size:1.85rem}
  .grid{grid-template-columns:1fr; gap:.1em 0}
  .grid dt{margin-top:.6em}
}

nav.jump{
  position:sticky; top:0; z-index:10; background:var(--bg);
  border-bottom:2px solid var(--accent); margin:0 0 2.4em; padding:.7em 0;
  display:flex; gap:1.3em; flex-wrap:wrap; font-size:.87rem;
  backdrop-filter:saturate(180%) blur(8px);
}
nav.jump a{color:var(--muted); font-weight:600; letter-spacing:.02em}
nav.jump a:hover{color:var(--accent); text-decoration:none}
h2{scroll-margin-top:4em}
@media (max-width:560px){ nav.jump{margin:0 -18px 1.8em; padding:.6em 18px; gap:1em} }

.head{display:flex; gap:1.9em; align-items:flex-start; margin-bottom:2.2em}
.head img{
  width:170px; height:170px; border-radius:50%; object-fit:cover;
  border:1px solid var(--rule); flex-shrink:0; margin-top:.35em;
}
.head .who{flex:1; min-width:0}
.head h1{margin-bottom:.1em}
.head .role{margin-bottom:.7em}
.head .links{margin-bottom:0}
@media (max-width:560px){
  .head{gap:1.1em}
  .head img{width:110px; height:110px}
}

.more{font-size:.83rem; color:var(--accent); white-space:nowrap; margin-left:.35em}
.back{font-size:.9rem; margin:0 0 1.8em}
.ptitle{font-size:2rem; margin:0 0 .3em; letter-spacing:-.02em}
.deep{margin-bottom:3.2em; scroll-margin-top:2em}
.dtitle{
  font-size:1.3rem; font-weight:700; letter-spacing:-.01em; text-transform:none;
  border-bottom:none; margin:0 0 .3em; padding:0; color:var(--fg);
}
.deep .meta{margin-bottom:1em}
.deep p{margin:0 0 .85em}

.subhead{
  font-size:.78rem; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); margin:1.6em 0 .9em;
}
.subhead:first-of-type{margin-top:0}

.tags{margin-top:.5em; display:flex; flex-wrap:wrap; gap:.4em}
.tags span{
  font-size:.76rem; line-height:1.5; padding:.12em .6em; border-radius:999px;
  background:var(--accent-soft); color:var(--accent); white-space:nowrap;
}
@media (max-width:560px){ .tags span{font-size:.72rem} }
</style>
<style>
.wrap{max-width:none; width:94vw; padding-top:1.2em}
.strip{height:10px; background:var(--accent); width:100%}
.strip.bottom{margin-top:2.2em}
.pf-title{display:flex; align-items:baseline; gap:.6em}
.pf-title .sub{color:var(--muted); font-size:.95rem; font-weight:400}
.back{font-size:.92rem; margin:1.2em 0 .4em}
.pf-head{display:flex; align-items:center; justify-content:space-between; gap:1em; flex-wrap:wrap; margin:.4em 0 .9em}
.pf-head h1{margin:0; font-size:1.5rem}
.tabs{display:inline-flex; border:1.5px solid var(--accent-line); border-radius:8px; overflow:hidden}
.tabs button{font:inherit; font-size:.9rem; font-weight:600; padding:.3em 1em; border:0; background:transparent; color:var(--accent); cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--accent); color:#fff}
.viewer{position:relative; border:1px solid var(--rule); border-radius:10px; background:#fff; overflow:hidden; box-shadow:0 2px 10px rgba(0,0,0,.08);
  height:calc(100vh - 13.5rem); min-height:320px; display:flex; align-items:center; justify-content:center}
.viewer .deck{display:none; width:100%; height:100%}
.viewer .deck.on{display:flex; align-items:center; justify-content:center}
.slide{display:none; max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain}
.slide.cur{display:block}
.arrow{position:absolute; top:50%; transform:translateY(-50%); width:2.4em; height:2.4em; border-radius:50%; border:0;
  background:var(--accent); color:#fff; font-size:1.1rem; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
  box-shadow:0 1px 4px rgba(0,0,0,.15); opacity:.85; transition:opacity .15s}
.arrow:hover{opacity:1}
.arrow[disabled]{opacity:.25; cursor:default}
.arrow.prev{left:.6em} .arrow.next{right:.6em}
.bar{display:flex; align-items:center; justify-content:space-between; gap:1em; flex-wrap:wrap; margin:.7em 0 0; font-size:.9rem; color:var(--muted)}
.dots{display:flex; gap:.45em}
.dots button{width:.6em; height:.6em; border-radius:50%; border:0; padding:0; background:var(--rule); cursor:pointer}
.dots button.on{background:var(--accent); transform:scale(1.25)}
.bar .right{display:flex; gap:1.1em}
kbd{font:inherit; font-size:.85em; border:1px solid var(--rule); border-radius:4px; padding:0 .35em; color:var(--muted)}
footer{border-top:2px solid var(--accent)}
</style>
</head>
<body>
<div class="strip" aria-hidden="true"></div>
<div class="wrap">
<p class="back"><a href="./">← Chanhee Park</a></p>
<div class="pf-head">
  <div class="pf-title"><h1>Portfolio</h1><span class="sub">Chanhee Park · NLP&amp;AI Lab, Korea University</span></div>
  <div class="tabs" role="tablist" aria-label="Language">
    <button role="tab" id="tab-en" aria-selected="true">English</button>
    <button role="tab" id="tab-ko" aria-selected="false">한국어</button>
  </div>
</div>
<div class="viewer" id="viewer" tabindex="0" aria-roledescription="carousel">
  <div id="deck-en" class="deck on">
<img class="slide" src="portfolio/en/p-1.png" alt="Portfolio page 1 (English)">
<img class="slide" src="portfolio/en/p-2.png" alt="Portfolio page 2 (English)" loading="lazy">
<img class="slide" src="portfolio/en/p-3.png" alt="Portfolio page 3 (English)" loading="lazy">
<img class="slide" src="portfolio/en/p-4.png" alt="Portfolio page 4 (English)" loading="lazy">
<img class="slide" src="portfolio/en/p-5.png" alt="Portfolio page 5 (English)" loading="lazy">
<img class="slide" src="portfolio/en/p-6.png" alt="Portfolio page 6 (English)" loading="lazy">
<img class="slide" src="portfolio/en/p-7.png" alt="Portfolio page 7 (English)" loading="lazy">
  </div>
  <div id="deck-ko" class="deck" lang="ko">
<img class="slide" src="portfolio/ko/p-1.png" alt="Portfolio page 1 (Korean)">
<img class="slide" src="portfolio/ko/p-2.png" alt="Portfolio page 2 (Korean)" loading="lazy">
<img class="slide" src="portfolio/ko/p-3.png" alt="Portfolio page 3 (Korean)" loading="lazy">
<img class="slide" src="portfolio/ko/p-4.png" alt="Portfolio page 4 (Korean)" loading="lazy">
<img class="slide" src="portfolio/ko/p-5.png" alt="Portfolio page 5 (Korean)" loading="lazy">
<img class="slide" src="portfolio/ko/p-6.png" alt="Portfolio page 6 (Korean)" loading="lazy">
<img class="slide" src="portfolio/ko/p-7.png" alt="Portfolio page 7 (Korean)" loading="lazy">
  </div>
  <button class="arrow prev" id="prev" aria-label="Previous page">&#x2039;</button>
  <button class="arrow next" id="next" aria-label="Next page">&#x203A;</button>
</div>
<div class="bar">
  <div class="dots" id="dots" aria-hidden="true"></div>
  <span id="counter">1 / 7</span>
  <div class="right"><span><kbd>←</kbd> <kbd>→</kbd> to navigate</span><a id="dl" href="portfolio.pdf">Download PDF</a></div>
</div>
<footer><a href="portfolio.pdf">English PDF</a> · <a href="portfolio-ko.pdf">한국어 PDF</a></footer>
</div>
<div class="strip bottom" aria-hidden="true"></div>
<script>
(function(){
  var lang='en', idx=0;
  var tabs={en:document.getElementById('tab-en'),ko:document.getElementById('tab-ko')};
  var decks={en:document.getElementById('deck-en'),ko:document.getElementById('deck-ko')};
  var slides=function(){return decks[lang].querySelectorAll('.slide');};
  var n=slides().length, dots=document.getElementById('dots'), counter=document.getElementById('counter');
  var prev=document.getElementById('prev'), next=document.getElementById('next'), dl=document.getElementById('dl'), viewer=document.getElementById('viewer');
  for(var i=0;i<n;i++){var b=document.createElement('button'); b.dataset.i=i; b.onclick=function(){go(+this.dataset.i);}; dots.appendChild(b);}
  function render(){
    for(var k in decks){decks[k].classList.toggle('on',k===lang); tabs[k].setAttribute('aria-selected',k===lang?'true':'false');}
    var s=slides(); for(var i=0;i<s.length;i++) s[i].classList.toggle('cur',i===idx);
    var d=dots.children; for(var j=0;j<d.length;j++) d[j].classList.toggle('on',j===idx);
    counter.textContent=(idx+1)+' / '+n; prev.disabled=idx===0; next.disabled=idx===n-1;
    dl.href=lang==='ko'?'portfolio-ko.pdf':'portfolio.pdf';
    history.replaceState(null,'','#'+lang+'-'+(idx+1));
    try{localStorage.setItem('pf-lang',lang);}catch(e){}
  }
  function go(i){idx=Math.max(0,Math.min(n-1,i)); render();}
  function setLang(l){lang=l; render();}
  prev.onclick=function(){go(idx-1);}; next.onclick=function(){go(idx+1);};
  tabs.en.onclick=function(){setLang('en');}; tabs.ko.onclick=function(){setLang('ko');};
  document.addEventListener('keydown',function(e){if(e.key==='ArrowLeft')go(idx-1); else if(e.key==='ArrowRight')go(idx+1);});
  var x0=null; viewer.addEventListener('touchstart',function(e){x0=e.touches[0].clientX;},{passive:true});
  viewer.addEventListener('touchend',function(e){if(x0===null)return; var dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>40) go(idx+(dx<0?1:-1)); x0=null;});
  var m=/^#(en|ko)(?:-(\d+))?$/.exec(location.hash); var saved=null; try{saved=localStorage.getItem('pf-lang');}catch(e){}
  if(m){lang=m[1]; idx=m[2]?Math.max(0,Math.min(n-1,+m[2]-1)):0;} else if(saved==='ko'){lang='ko';}
  render();
})();
</script>
</body>
</html>
